[workspace]
exclude = ["vendor/mdns-sd"]
members = ["carplay-iap2", "carplay-airplay", "direlay-linux"]
resolver = "2"

[workspace.package]
version = "0.1.4-rc.1"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
carplay-iap2 = { path = "carplay-iap2" }
carplay-airplay = { path = "carplay-airplay" }
oxp-wire = { path = "../../OpenXPlay-Stream/rust/oxp-wire" }
oxp-core = { path = "../../OpenXPlay-Stream/rust/oxp-core" }
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
aes = "=0.8.4"
ctr = "=0.9.2"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
sha1 = "=0.10.7"
der = { version = "=0.7.10", features = ["alloc"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
num-bigint = "=0.4.8"
plist = "=1.10.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
# Linux platform and admin page (provisioned 2026-10-15).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
x509-cert = "0.2"
cms = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep the socket owner responsible for RFC 6762 negative host answers.
[patch.crates-io]
mdns-sd = { path = "vendor/mdns-sd" }
